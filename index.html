<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYED ALIYAN — Portfolio</title>

<meta name="description"
content="Syed Aliyan — Web Developer and Creative Digital Experience Builder.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{

    --black:#030303;
    --black2:#080808;

    --gold:#d8b85c;
    --gold-light:#ffe39a;

    --white:#ffffff;
    --muted:#8e8e8e;

    --border:rgba(255,255,255,.09);

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:var(--black);

    color:white;

    font-family:Inter,Arial,sans-serif;

    overflow-x:hidden;

}

body::before{

    content:"";

    position:fixed;

    inset:0;

    z-index:-5;

    background:

    radial-gradient(
        circle at 15% 15%,
        rgba(216,184,92,.10),
        transparent 30%
    ),

    radial-gradient(
        circle at 85% 75%,
        rgba(255,255,255,.04),
        transparent 25%
    );

}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}


/* =========================================================
   CINEMATIC INTRO
========================================================= */

#cinematicIntro{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#020202;

    z-index:99999;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

    transition:

        opacity 1.2s ease,

        visibility 1.2s ease;

}


/* Gold cinematic light */

#cinematicIntro::before{

    content:"";

    position:absolute;

    width:600px;
    height:600px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(216,184,92,.16),
            transparent 65%
        );

    animation:

        cinematicGlow 4s ease-in-out infinite;

}


/* Thin cinematic lines */

.cinema-line{

    position:absolute;

    width:100%;

    height:1px;

    left:0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,227,154,.5),
            transparent
        );

    opacity:.35;

}

.cinema-line.top{
    top:18%;
}

.cinema-line.bottom{
    bottom:18%;
}


/* Intro content */

.intro-content{

    position:relative;

    z-index:5;

    width:90%;

}


/* Small welcome */

.intro-welcome{

    display:block;

    color:#888;

    font-size:10px;

    font-weight:600;

    letter-spacing:8px;

    margin-bottom:25px;

    opacity:0;

    transform:translateY(20px);

    animation:

        welcomeReveal .9s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:.4s;

}


/* Main title */

.intro-name{

    font-family:"Space Grotesk";

    font-weight:700;

    font-size:

        clamp(
            45px,
            10vw,
            110px
        );

    line-height:.82;

    letter-spacing:-6px;

    margin:0;

    overflow:hidden;

}


/* Each animated line */

.intro-name span{

    display:block;

    opacity:0;

    transform:

        translateY(120px)
        scale(.85);

    animation:

        cinematicText 1.15s
        cubic-bezier(.16,1,.3,1)
        forwards;

}


/* Aliyan */

.intro-name .aliyan{

    color:white;

    animation-delay:.65s;

}


/* Portfolio */

.intro-name .portfolio{

    color:var(--gold-light);

    font-size:.58em;

    letter-spacing:9px;

    margin-top:17px;

    animation-delay:1s;

}


/* Gold line */

.intro-gold-line{

    width:0;

    height:1px;

    margin:32px auto 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--gold-light),
            transparent
        );

    animation:

        goldLine 1.1s ease forwards;

    animation-delay:1.45s;

}


/* Little loading text */

.intro-loading{

    margin-top:22px;

    font-size:9px;

    letter-spacing:4px;

    color:#555;

    opacity:0;

    animation:

        welcomeFade .8s forwards;

    animation-delay:1.7s;

}


/* Intro disappears */

#cinematicIntro.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}


/* Cinematic exit flash */

#cinematicIntro.hide::after{

    content:"";

    position:absolute;

    inset:0;

    background:white;

    opacity:.15;

    animation:cinemaFlash .7s ease;

}


@keyframes welcomeReveal{

    to{

        opacity:1;

        transform:translateY(0);

    }

}


@keyframes cinematicText{

    0%{

        opacity:0;

        transform:

            translateY(120px)
            scale(.85);

        filter:blur(12px);

    }

    60%{

        opacity:1;

    }

    100%{

        opacity:1;

        transform:

            translateY(0)
            scale(1);

        filter:blur(0);

    }

}


@keyframes goldLine{

    to{

        width:280px;

    }

}


@keyframes welcomeFade{

    to{

        opacity:1;

    }

}


@keyframes cinematicGlow{

    0%,100%{

        transform:scale(.85);

        opacity:.45;

    }

    50%{

        transform:scale(1.15);

        opacity:1;

    }

}


@keyframes cinemaFlash{

    from{
        opacity:.35;
    }

    to{
        opacity:0;
    }

}


/* =========================================================
   NAVBAR
========================================================= */

nav{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    height:74px;

    z-index:500;

    background:

        rgba(3,3,3,.65);

    backdrop-filter:blur(18px);

    border-bottom:

        1px solid var(--border);

}


.nav{

    height:100%;

    width:min(1180px,92%);

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.logo{

    font-size:18px;

    font-weight:900;

    letter-spacing:3px;

}


.logo span{

    color:var(--gold-light);

}


.nav-links{

    display:flex;

    gap:30px;

}


.nav-links a{

    color:#999;

    font-size:11px;

    letter-spacing:1px;

    transition:.3s;

}


.nav-links a:hover{

    color:white;

}


/* =========================================================
   HERO
========================================================= */

.container{

    width:min(1180px,92%);

    margin:auto;

}


.hero{

    min-height:100vh;

    padding:

        130px 0
        80px;

    display:flex;

    align-items:center;

}


.hero-grid{

    display:grid;

    grid-template-columns:

        1.1fr
        .9fr;

    gap:70px;

    align-items:center;

}


.status{

    display:inline-flex;

    align-items:center;

    gap:9px;

    padding:10px 15px;

    border:

        1px solid var(--border);

    border-radius:50px;

    color:#999;

    font-size:10px;

    letter-spacing:1.5px;

}


.status-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#62ff91;

    box-shadow:

        0 0 18px #62ff91;

}


.hero h1{

    font-family:"Space Grotesk";

    font-size:

        clamp(
            55px,
            8vw,
            105px
        );

    line-height:.87;

    letter-spacing:-6px;

    margin:28px 0;

}


.outline{

    color:transparent;

    -webkit-text-stroke:

        1px #777;

}


.gold{

    color:var(--gold-light);

}


.hero-description{

    color:#999;

    max-width:590px;

    line-height:1.9;

    font-size:15px;

}


.buttons{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    margin-top:30px;

}


.btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:14px 21px;

    border-radius:50px;

    font-size:11px;

    font-weight:800;

    border:1px solid transparent;

    cursor:pointer;

    transition:.3s;

}


.btn:hover{

    transform:translateY(-4px);

}


.btn-gold{

    background:

        linear-gradient(
            135deg,
            #ffe9a7,
            #d8b85c
        );

    color:#000;

}


.btn-dark{

    background:transparent;

    color:white;

    border-color:var(--border);

}


/* =========================================================
   PROFILE ANIMATION
========================================================= */

.profile-area{

    min-height:500px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}


.profile-ring{

    width:370px;

    height:370px;

    border:

        1px solid
        rgba(216,184,92,.35);

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    animation:

        rotateRing 16s
        linear infinite;

}


.profile-ring::before{

    content:"";

    position:absolute;

    width:9px;

    height:9px;

    border-radius:50%;

    background:var(--gold-light);

    box-shadow:

        0 0 25px
        var(--gold-light);

}


.profile-inner{

    width:290px;

    height:290px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:

        radial-gradient(
            circle,
            rgba(216,184,92,.16),
            #090909 65%
        );

    border:

        1px solid
        rgba(255,255,255,.08);

    animation:

        counterRing 16s
        linear infinite;

}


.profile-inner h3{

    font-family:"Space Grotesk";

    font-size:28px;

}


.profile-inner p{

    color:#777;

    font-size:9px;

    letter-spacing:3px;

    margin-top:10px;

}


@keyframes rotateRing{

    to{
        transform:rotate(360deg);
    }

}


@keyframes counterRing{

    to{
        transform:rotate(-360deg);
    }

}


/* =========================================================
   MARQUEE
========================================================= */

.marquee{

    overflow:hidden;

    white-space:nowrap;

    border-top:

        1px solid var(--border);

    border-bottom:

        1px solid var(--border);

    padding:17px 0;

}


.marquee-track{

    display:inline-block;

    animation:

        marquee 24s
        linear infinite;

}


.marquee span{

    margin:0 30px;

    color:#777;

    font-family:"Space Grotesk";

    font-size:12px;

    letter-spacing:3px;

}


.marquee b{

    color:var(--gold-light);

}


@keyframes marquee{

    to{

        transform:
            translateX(-50%);

    }

}


/* =========================================================
   SECTIONS
========================================================= */

.section{

    padding:110px 0;

}


.section-title{

    text-align:center;

    margin-bottom:55px;

}


.section-title small{

    color:var(--gold-light);

    letter-spacing:4px;

    font-size:10px;

}


.section-title h2{

    font-family:"Space Grotesk";

    font-size:

        clamp(
            42px,
            7vw,
            76px
        );

    letter-spacing:-4px;

    margin-top:14px;

}


/* =========================================================
   ABOUT
========================================================= */

.about-grid{

    display:grid;

    grid-template-columns:

        .7fr
        1.3fr;

    gap:70px;

    align-items:center;

}


.about-number{

    font-family:"Space Grotesk";

    font-size:180px;

    color:transparent;

    -webkit-text-stroke:

        1px #292929;

}


.about h3{

    font-family:"Space Grotesk";

    font-size:38px;

    margin-bottom:20px;

}


.about p{

    color:#999;

    line-height:1.9;

    margin-bottom:18px;

}


/* =========================================================
   SKILLS
========================================================= */

.skills{

    display:grid;

    grid-template-columns:

        repeat(4,1fr);

    gap:15px;

}


.skill{

    min-height:165px;

    padding:27px;

    background:

        linear-gradient(
            145deg,
            #0e0e0e,
            #080808
        );

    border:

        1px solid var(--border);

    border-radius:20px;

    transition:.4s;

}


.skill:hover{

    transform:

        translateY(-9px);

    border-color:

        rgba(216,184,92,.5);

}


.skill-number{

    color:#555;

    font-size:11px;

}


.skill h3{

    margin-top:45px;

    font-size:17px;

}


/* =========================================================
   PROJECTS
========================================================= */

.projects{

    display:grid;

    grid-template-columns:

        repeat(2,1fr);

    gap:18px;

}


.project{

    min-height:350px;

    position:relative;

    overflow:hidden;

    border:

        1px solid var(--border);

    border-radius:23px;

    background:#090909;

    transition:.4s;

}


.project:hover{

    transform:

        translateY(-7px);

    border-color:

        rgba(216,184,92,.5);

}


.project-number{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:"Space Grotesk";

    font-size:110px;

    font-weight:900;

    color:#151515;

}


.project-info{

    position:absolute;

    bottom:25px;

    left:25px;

}


.project-info small{

    color:var(--gold-light);

    letter-spacing:2px;

}


.project-info h3{

    font-family:"Space Grotesk";

    font-size:29px;

    margin-top:7px;

}


/* =========================================================
   TERMINAL
========================================================= */

.terminal{

    border:

        1px solid var(--border);

    border-radius:20px;

    overflow:hidden;

    background:#080808;

}


.terminal-top{

    height:43px;

    border-bottom:

        1px solid var(--border);

    display:flex;

    align-items:center;

    gap:7px;

    padding:0 15px;

}


.terminal-dot{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#333;

}


.terminal-body{

    padding:30px;

    min-height:290px;

    font-family:monospace;

    line-height:2;

    color:#999;

}


.green{

    color:#70ff9a;

}


.terminal-gold{

    color:var(--gold-light);

}


/* =========================================================
   SERVICES
========================================================= */

.services{

    display:grid;

    grid-template-columns:

        repeat(3,1fr);

    gap:15px;

}


.service{

    padding:35px;

    border:

        1px solid var(--border);

    border-radius:20px;

    background:#0a0a0a;

}


.service-icon{

    color:var(--gold-light);

    font-size:30px;

}


.service h3{

    margin:22px 0 12px;

}


.service p{

    color:#888;

    line-height:1.8;

}


/* =========================================================
   CONTACT
========================================================= */

.contact{

    text-align:center;

    padding:80px 20px;

    border:

        1px solid var(--border);

    border-radius:30px;

    background:

        radial-gradient(
            circle at center,
            rgba(216,184,92,.09),
            transparent 52%
        );

}


.contact small{

    color:var(--gold-light);

    letter-spacing:3px;

}


.contact h2{

    font-family:"Space Grotesk";

    font-size:

        clamp(
            45px,
            8vw,
            90px
        );

    line-height:.9;

    letter-spacing:-5px;

    margin:18px 0;

}


.contact p{

    max-width:550px;

    margin:auto;

    color:#888;

    line-height:1.8;

}


.contact-buttons{

    justify-content:center;

}


/* =========================================================
   FOOTER
========================================================= */

footer{

    padding:35px 0;

    text-align:center;

    border-top:

        1px solid var(--border);

    color:#666;

    font-size:10px;

}


/* =========================================================
   SCROLL REVEAL
========================================================= */

.reveal{

    opacity:0;

    transform:

        translateY(35px);

    transition:

        opacity .8s ease,
        transform .8s ease;

}


.reveal.show{

    opacity:1;

    transform:

        translateY(0);

}


/* =========================================================
   CUSTOM CURSOR
========================================================= */

.cursor{

    position:fixed;

    width:18px;

    height:18px;

    border:

        1px solid var(--gold-light);

    border-radius:50%;

    pointer-events:none;

    transform:

        translate(-50%,-50%);

    z-index:999999;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .nav-links{
        display:none;
    }

    .hero-grid{
        grid-template-columns:1fr;
    }

    .about-grid{
        grid-template-columns:1fr;
    }

    .skills{
        grid-template-columns:
            repeat(2,1fr);
    }

    .projects{
        grid-template-columns:1fr;
    }

    .services{
        grid-template-columns:1fr;
    }

    .profile-area{
        min-height:400px;
    }

    .profile-ring{
        width:300px;
        height:300px;
    }

    .profile-inner{
        width:235px;
        height:235px;
    }

    .about-number{
        font-size:110px;
    }

}


@media(max-width:500px){

    .skills{
        grid-template-columns:1fr;
    }

    .hero h1{
        letter-spacing:-4px;
    }

    .cursor{
        display:none;
    }

    .intro-name{
        letter-spacing:-4px;
    }

    .intro-name .portfolio{
        letter-spacing:5px;
    }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;

        transition-duration:.01ms !important;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     CINEMATIC INTRO
======================================================== -->

<div id="cinematicIntro">

    <div class="cinema-line top"></div>

    <div class="cinema-line bottom"></div>


    <div class="intro-content">

        <span class="intro-welcome">
            WELCOME TO
        </span>


        <h1 class="intro-name">

            <span class="aliyan">
                SYED ALIYAN
            </span>

            <span class="portfolio">
                PORTFOLIO
            </span>

        </h1>


        <div class="intro-gold-line"></div>


        <div class="intro-loading">
            CREATING DIGITAL EXPERIENCES
        </div>

    </div>

</div>



<!-- =======================================================
     NAVBAR
======================================================== -->

<nav>

<div class="nav">

    <div class="logo">
        SYED <span>ALIYAN</span>
    </div>


    <div class="nav-links">

        <a href="#about">
            ABOUT
        </a>

        <a href="#skills">
            SKILLS
        </a>

        <a href="#work">
            WORK
        </a>

        <a href="#services">
            SERVICES
        </a>

        <a href="#contact">
            CONTACT
        </a>

    </div>

</div>

</nav>



<!-- =======================================================
     HERO
======================================================== -->

<section class="hero">

<div class="container hero-grid">


<div>

    <div class="status">

        <span class="status-dot"></span>

        AVAILABLE FOR FREELANCE PROJECTS

    </div>


    <h1>

        I BUILD

        <br>

        <span class="outline">
